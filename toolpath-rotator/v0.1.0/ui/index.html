<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <title>Toolpath Rotator</title>

    <script type="importmap">

    </script>
    <script type="module" crossorigin src="./assets/index-BF1AcFnu.js"></script>

  <body>
    <main class="shell">
      <header><span class="eyebrow">CARVE TOOL</span><h1>Toolpath Rotator</h1><p>Rotate a G-code file clockwise and place its lower-left XY corner at work zero.</p></header>
      <label class="file-picker">Choose G-code file<input id="file" type="file" accept=".nc,.gcode,.tap,.ngc,.txt"></label>
      <div class="file-name" id="fileName">No source file selected</div>
      <label class="angle-picker" for="angle">Clockwise rotation<select id="angle"><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label>
      <button id="rotate" type="button" disabled>↻ Rotate and load into visualizer</button>
      <div id="status" role="status" aria-live="polite">Choose the original G-code file to begin. Each press rotates the previous result.</div>
      <small>Loads a transformed copy into the visualizer. Does not start a CNC job.</small>
    </main>
  </body>
</html>
